name: dorm_care_staff
description: แอปผู้ดูแลหอพักและช่างซ่อมบำรุง ของระบบแจ้งซ่อมหอพัก (Dormitory Maintenance Reporting System)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # IBM Plex Sans Thai (SIL Open Font License, ไฟล์ OFL.txt อยู่ในโฟลเดอร์เดียวกัน)
  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
