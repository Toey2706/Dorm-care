# Supabase แผนฟรีหยุดโปรเจกต์เองถ้าไม่มีการใช้งานนานราว 7 วัน (ข้อมูลจากแหล่งรอง ยังไม่ได้ยืนยันกับหน้าทางการ)
# เรียกฐานข้อมูลทุก 3 วันกันไว้ ช่วงปิดเทอมหรือรออาจารย์ตรวจงานระบบจะได้ไม่หลับ
name: keepalive

on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ใช้ anon key ตัวเดียวกับที่ฝังในแอปอยู่แล้ว RLS ทำให้ได้ผลว่างกลับมา แต่นับเป็นการใช้งานฐานข้อมูล
      - name: เรียกฐานข้อมูล
        run: |
          URL=$(jq -r .SUPABASE_URL app/config.json)
          KEY=$(jq -r .SUPABASE_ANON_KEY app/config.json)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/rooms?select=room_no&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" = "200"
